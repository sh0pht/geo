name: Build GeoCAD Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          modules: 'qt5compat'
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Package Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/GeoCAD.exe package/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --dir package package/GeoCAD.exe
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: GeoCAD-Windows-Setup
          path: dist/GeoCAD_Setup.exe
          if-no-files-found: error
